x-app-env: &app-env
  SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
  DB_NAME: ${DB_NAME:-contract_db}
  DB_USER: ${DB_USER:-postgres}
  DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
  DB_HOST: postgres
  DB_PORT: '5432'
  DB_SSLMODE: disable
  VLLM_BASE_URL: ${VLLM_BASE_URL:-}
  COLPALI_BASE_URL: ${COLPALI_BASE_URL:-}
  QWEN_MODEL_ID: ${QWEN_MODEL_ID:-Qwen/Qwen2.5-VL-7B-Instruct-AWQ}
  QDRANT_URL: http://qdrant:6333
  NEO4J_URI: bolt://neo4j:7687
  NEO4J_USER: neo4j
  NEO4J_PASSWORD: ${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in .env}
  NEO4J_DATABASE: neo4j
  A3_GRAPH_ENABLED: 'True'
  A3_KNOWLEDGE_ENABLED: 'True'
  A3_ENTITY_PROVIDER: gliner
  RAG_INFERENCE_URL: http://a3-inference:8010

x-app: &app
  image: evidence-pods-web:latest
  restart: unless-stopped
  working_dir: /app
  volumes:
    - .:/app
  networks:
    - app-net

services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-contract_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - app-net

  qdrant:
    image: qdrant/qdrant:v1.13.6
    restart: unless-stopped
    ports:
      - "127.0.0.1:6335:6333"
    volumes:
      - qdrant-data:/qdrant/storage
    networks:
      - app-net

  neo4j:
    image: neo4j:5.26-community
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in .env}
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
    ports:
      - "127.0.0.1:7475:7474"
      - "127.0.0.1:7688:7687"
    volumes:
      - neo4j-data:/data
    networks:
      - app-net

  a3-inference:
    <<: *app
    gpus: all
    command: sh /app/runtime/start_a3_linux_runtime.sh
    environment:
      HF_HOME: /model-cache
      HF_HUB_CACHE: /model-cache/hub
      HUGGINGFACE_HUB_CACHE: /model-cache/hub
      BGE_LOCAL_CACHE: /model-cache/hub
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      RAG_TEXT_DEVICE: cuda
      RAG_STREAM_CHECKPOINTS: '1'
      RAG_IDLE_UNLOAD_SECONDS: '120'
      GLINER_MODEL_PATH: /app/scratch/a3-models/gliner-relex-multi-v1.0
      NLI_MODEL_PATH: /app/scratch/a3-models/nli-deberta-v3-xsmall
      BGE_MODEL_PATH: /app/scratch/a3-models/bge-m3
      SURYA_INFERENCE_BACKEND: llamacpp
      SURYA_GGUF_LOCAL_MODEL_PATH: /app/scratch/a3-models/surya/surya-2.gguf
      SURYA_GGUF_LOCAL_MMPROJ_PATH: /app/scratch/a3-models/surya/surya-2-mmproj.gguf
      SURYA_INFERENCE_PARALLEL: '2'
      SURYA_INFERENCE_CTX_SIZE: '32768'
      SURYA_INFERENCE_KEEP_ALIVE: 'True'
      SURYA_INFERENCE_AUTOSTART: 'False'
      SURYA_INFERENCE_URL: http://127.0.0.1:8011/v1
      SURYA_MANAGED_BACKEND: '1'
      SURYA_EXCLUSIVE_GPU: '1'
      SURYA_PAGE_GENERATION_TIMEOUT: '0'
      SURYA_REQUEST_GENERATION_TIMEOUT: '0'
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    volumes:
      - .:/app
      - ${A3_HF_CACHE_DIR:?Set A3_HF_CACHE_DIR in .env}:/model-cache
    healthcheck:
      test: ['CMD', '/app/scratch/a3-linux-runtime/bin/python', '-c', "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/rag/health', timeout=5)"]
      interval: 15s
      timeout: 8s
      retries: 8
      start_period: 90s

  web:
    <<: *app
    build:
      context: .
    command: python manage.py runserver 0.0.0.0:8000 --noreload
    environment: *app-env
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  knowledge-worker:
    <<: *app
    command: python manage.py knowledge_worker
    environment: *app-env
    depends_on:
      postgres:
        condition: service_healthy

  entity-worker:
    <<: *app
    command: python manage.py resolve_document_entities --watch
    environment: *app-env
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
  qdrant-data:
  neo4j-data:

networks:
  app-net:
