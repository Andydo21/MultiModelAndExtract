# Lightweight web runtime using the database configured in the root .env.
services:
  a3-inference:
    image: riskdl-web-local:latest
    container_name: contract_a3_inference
    restart: unless-stopped
    gpus: all
    working_dir: /app
    command: sh /app/evaluation/start_a3_linux_runtime.sh
    environment:
      HF_HOME: /model-cache
      HF_HUB_CACHE: /model-cache/hub
      HUGGINGFACE_HUB_CACHE: /model-cache/hub
      BGE_LOCAL_CACHE: /model-cache/hub
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      RAG_TEXT_DEVICE: cuda
      RAG_STREAM_CHECKPOINTS: '1'
      RAG_IDLE_UNLOAD_SECONDS: '120'
      GLINER_MODEL_PATH: /app/scratch/a3-models/gliner-relex-multi-v1.0
      NLI_MODEL_PATH: /app/scratch/a3-models/nli-deberta-v3-xsmall
      BGE_MODEL_PATH: /app/scratch/a3-models/bge-m3
      SURYA_INFERENCE_BACKEND: llamacpp
      SURYA_GGUF_LOCAL_MODEL_PATH: /app/scratch/a3-models/surya/surya-2.gguf
      SURYA_GGUF_LOCAL_MMPROJ_PATH: /app/scratch/a3-models/surya/surya-2-mmproj.gguf
      SURYA_INFERENCE_PARALLEL: '2'
      SURYA_INFERENCE_CTX_SIZE: '32768'
      SURYA_INFERENCE_KEEP_ALIVE: 'True'
      SURYA_INFERENCE_AUTOSTART: 'False'
      SURYA_INFERENCE_URL: http://127.0.0.1:8011/v1
      SURYA_MANAGED_BACKEND: '1'
      SURYA_EXCLUSIVE_GPU: '1'
      SURYA_PAGE_GENERATION_TIMEOUT: '0'
      SURYA_REQUEST_GENERATION_TIMEOUT: '0'
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      A3_DOCKER_LOG_CONTAINER: ''
    volumes:
      - .:/app
      - ${A3_HF_CACHE_DIR:-D:/hf_cache}:/model-cache
    healthcheck:
      test: ['CMD', '/app/scratch/a3-linux-runtime/bin/python', '-c', "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/rag/health', timeout=5)"]
      interval: 15s
      timeout: 8s
      retries: 8
      start_period: 90s
    networks:
      - riskdl-net
  entity-worker:
    image: riskdl-web-local:latest
    container_name: contract_entity_worker
    restart: unless-stopped
    working_dir: /app
    command: python manage.py resolve_document_entities --watch
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - A3_ENTITY_PROVIDER=gliner
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_SSLMODE=disable
      - RAG_INFERENCE_URL=http://a3-inference:8010
      - NEO4J_URI=${NEO4J_DOCKER_URI:-}
      - NEO4J_USER=${NEO4J_USER:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-}
      - NEO4J_DATABASE=${NEO4J_DATABASE:-neo4j}
    volumes:
      - .:/app
    networks:
      - riskdl-net
  knowledge-worker:
    image: riskdl-web-local:latest
    container_name: contract_knowledge_worker
    restart: unless-stopped
    working_dir: /app
    command: python manage.py knowledge_worker
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - A3_ENTITY_PROVIDER=gliner
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_SSLMODE=disable
      - RAG_INFERENCE_URL=http://a3-inference:8010
      - NEO4J_URI=${NEO4J_DOCKER_URI:-}
      - NEO4J_USER=${NEO4J_USER:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-}
      - NEO4J_DATABASE=${NEO4J_DATABASE:-neo4j}
    volumes:
      - .:/app
    networks:
      - riskdl-net
  qdrant:
    image: qdrant/qdrant:v1.13.6
    container_name: contract_qdrant
    restart: unless-stopped
    ports:
      - "127.0.0.1:6335:6333"
    volumes:
      - contract-a3-qdrant:/qdrant/storage
    networks:
      - riskdl-net
  web:
    restart: unless-stopped
    command: python manage.py runserver 0.0.0.0:8000 --noreload
    image: riskdl-web-local:latest
    build:
      context: .
      dockerfile: Dockerfile.web-local
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - RAG_INFERENCE_URL=http://a3-inference:8010
      - A3_ENTITY_PROVIDER=gliner
    depends_on:
      a3-inference:
        condition: service_healthy
  ai-service:
    restart: "no"
    image: contract-ai-local:latest
    build:
      context: .
      dockerfile: Dockerfile.ai-local
      args:
        BASE_IMAGE: riskdl-ai-service:latest
  ai-summary:
    restart: "no"
    image: contract-summary-local:latest
    build:
      context: .
      dockerfile: Dockerfile.ai-local
      args:
        BASE_IMAGE: riskdl-ai-summary:latest
  workflow-service:
    restart: "no"
    image: riskdl-web-local:latest
    build:
      context: .
      dockerfile: Dockerfile.web-local
    ports:
      - "127.0.0.1:8003:8000"
  blockchain-service:
    restart: "no"
    image: riskdl-web-local:latest
    build:
      context: .
      dockerfile: Dockerfile.web-local
    ports:
      - "127.0.0.1:8002:8000"
  fabric-init:
    container_name: contract_fabric_init
  orderer.example.com:
    container_name: contract_orderer
    restart: "no"
    volumes:
      - contract-orderer-ledger:/var/hyperledger/production/orderer
  peer0.org1.example.com:
    container_name: contract_peer
    restart: "no"
    volumes:
      - contract-peer-ledger:/var/hyperledger/production
  fabric-cli:
    container_name: contract_fabric_cli
  fabric-chaincode:
    container_name: contract_chaincode
    restart: "no"
    volumes:
      - contract-go-cache:/go/pkg/mod
      - contract-go-build:/root/.cache/go-build
      - ./fabric/crypto-config/peerOrganizations/org1.example.com/users/User1@org1.example.com/msp/signcerts/User1@org1.example.com-cert.pem:/gateway-cert.pem:ro
    environment:
      ENTERPRISE_GATEWAY_CERT_PATH: /gateway-cert.pem
  fabric-gateway:
    container_name: contract_fabric_gateway
    restart: "no"
    entrypoint: /bin/sh -c "npm ci --omit=dev && npm start"
  ledger-worker:
    image: riskdl-web-local:latest
    container_name: contract_ledger_worker
    restart: "no"
    working_dir: /app
    command: python manage.py ledger_worker
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_SSLMODE=disable
    volumes:
      - .:/app
    networks:
      - riskdl-net
  gateway:
    restart: "no"
volumes:
  contract-a3-qdrant:
  contract-orderer-ledger:
  contract-peer-ledger:
  contract-go-cache:
  contract-go-build:
