# Optional overlay: use alongside docker-compose.yml. Password must be set first.
services:
  neo4j:
    image: neo4j:5.26-community
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in the root .env}
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
    ports:
      - "127.0.0.1:7475:7474"
      - "127.0.0.1:7688:7687"
    volumes:
      - contract-document-graph:/data
    networks:
      - riskdl-net
  web:
    environment:
      - A3_GRAPH_ENABLED=True
      - A3_KNOWLEDGE_ENABLED=True
      - NEO4J_URI=${NEO4J_DOCKER_URI:-bolt://neo4j:7687}
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in the root .env}
      - NEO4J_DATABASE=neo4j
volumes:
  contract-document-graph:
